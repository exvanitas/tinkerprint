[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statsheet"
version = "0.1.0"
description = "Turn your git history and coding-agent logs into an RPG stat sheet. Local only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
statsheet = "statsheet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
