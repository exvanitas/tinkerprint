[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkerprint"
version = "0.1.0"
description = "Turn your git history and coding-agent logs into an RPG stat sheet. Local only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Windows Python ships no time-zone data, so zoneinfo needs the tzdata package there.
dependencies = ['tzdata; sys_platform == "win32"']

[project.urls]
Homepage = "https://github.com/exvanitas/tinkerprint"

[project.scripts]
tinkerprint = "tinkerprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
